<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excel Universal Translator</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 14px;
      margin: 0;
      background-color: #f8f9fa;
      color: #333;
    }
    .badge {
      display: inline-block;
      background-color: #e1dfdd;
      color: #107c41;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 10px 0;
      color: #107c41;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .radio-group {
      background: #fff;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .radio-option {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .radio-option:last-child {
      margin-bottom: 0;
    }
    .radio-option input {
      margin-right: 6px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #107c41;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-top: 6px;
    }
    button:hover {
      background-color: #0b5c30;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 18px;
    }
    .success { color: #107c41; font-weight: 600; }
    .error { color: #d83b01; font-weight: 600; }
  </style>
</head>
<body>
  <div class="badge">🇮🇩 ID &rarr; 🇬🇧 EN</div>
  <h2>Penerjemah Sel & Shape</h2>
  
  <div class="form-group">
    <label>Posisi Terjemahan di Sel/Shape:</label>
    <div class="radio-group">
      <label class="radio-option">
        <input type="radio" name="position" value="inline" checked>
        Di Samping: <code>Teks English</code>
      </label>
      <label class="radio-option">
        <input type="radio" name="position" value="newline">
        Di Bawah: <code>Teks [Baris Baru] English</code>
      </label>
    </div>
  </div>

  <button id="translateBtn">Terjemahkan Pilihan</button>
  
  <div id="status"></div>

  <script src="taskpane.js"></script>
</body>
</html>
