<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Translator 2016</title>
  
  <!-- Polyfill untuk kompatibilitas IE11 / Excel 2016 Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-polyfill/7.12.1/polyfill.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fetch/3.6.2/fetch.min.js"></script>
  
  <!-- Office JS -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { user-select: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 min-h-screen flex flex-col justify-between">

  <div class="space-y-4">
    <!-- Header -->
    <div class="border-b pb-2">
      <h1 class="text-base font-bold text-emerald-700 flex items-center gap-2">
        🌐 Excel Translator
      </h1>
      <p class="text-xs text-gray-500">Penerjemah sel otomatis (Kompatibel Excel 2016+)</p>
    </div>

    <!-- Pilihan Bahasa -->
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Bahasa Asal (Sebelum)</label>
        <select id="sourceLang" class="w-full text-xs p-2 border rounded bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          <option value="auto" selected>Auto Detect (Otomatis)</option>
          <option value="en">English (Inggris)</option>
          <option value="id">Indonesian (Indonesia)</option>
          <option value="ja">Japanese (Jepang)</option>
          <option value="zh">Chinese (Mandarin)</option>
          <option value="ko">Korean (Korea)</option>
          <option value="es">Spanish (Spanyol)</option>
          <option value="fr">French (Prancis)</option>
          <option value="de">German (Jerman)</option>
          <option value="ar">Arabic (Arab)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Bahasa Tujuan (Sesudah)</label>
        <select id="targetLang" class="w-full text-xs p-2 border rounded bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          <option value="id" selected>Indonesian (Indonesia)</option>
          <option value="en">English (Inggris)</option>
          <option value="ja">Japanese (Jepang)</option>
          <option value="zh">Chinese (Mandarin)</option>
          <option value="ko">Korean (Korea)</option>
          <option value="es">Spanish (Spanyol)</option>
          <option value="fr">French (Prancis)</option>
          <option value="de">German (Jerman)</option>
          <option value="ar">Arabic (Arab)</option>
        </select>
      </div>
    </div>

    <!-- Pilihan Lokasi Hasil -->
    <div class="space-y-1">
      <label class="block text-xs font-semibold text-gray-600 mb-1">Posisi Hasil Terjemahan</label>
      <div class="space-y-1.5 bg-white p-2.5 border rounded">
        <label class="flex items-center text-xs gap-2 cursor-pointer">
          <input type="radio" name="position" value="right" checked class="text-emerald-600 focus:ring-emerald-500">
          <span>Di Samping (Kolom Sebelah)</span>
        </label>
        <label class="flex items-center text-xs gap-2 cursor-pointer">
          <input type="radio" name="position" value="below" class="text-emerald-600 focus:ring-emerald-500">
          <span>Di Bawah (Baris Sebelah)</span>
        </label>
        <label class="flex items-center text-xs gap-2 cursor-pointer">
          <input type="radio" name="position" value="replace" class="text-emerald-600 focus:ring-emerald-500">
          <span>Timpa Sel Asli (Overwrite)</span>
        </label>
      </div>
    </div>

    <!-- Tombol Eksekusi -->
    <button id="btnTranslate" onclick="handleTranslate()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold py-2.5 px-4 rounded text-xs transition duration-150 shadow flex justify-center items-center gap-2">
      <span id="btnText">Terjemahkan Sel Terpilih</span>
    </button>

    <!-- Status Output -->
    <div id="status" class="hidden text-xs p-2.5 rounded border"></div>
  </div>

  <div class="text-[10px] text-gray-400 text-center mt-4">
    Excel Desktop & Web Add-in v2.0
  </div>

  <script>
    // Inisialisasi Office JS
    Office.onReady(function (info) {
      if (info.host === Office.HostType.Excel) {
        showStatus("Add-in siap digunakan.", "info");
      }
    });

    // Fungsi Utama Eksekusi Terjemahan
    function handleTranslate() {
      var btn = document.getElementById("btnTranslate");
      var btnText = document.getElementById("btnText");
      var srcLang = document.getElementById("sourceLang").value;
      var tgtLang = document.getElementById("targetLang").value;
      var radios = document.getElementsByName("position");
      var position = "right";

      for (var i = 0; i < radios.length; i++) {
        if (radios[i].checked) {
          position = radios[i].value;
          break;
        }
      }

      btn.disabled = true;
      btnText.innerText = "Menerjemahkan...";
      showStatus("Membaca sel yang dipilih...", "info");

      Excel.run(function (context) {
        var range = context.workbook.getSelectedRange();
        range.load(["values", "rowCount", "columnCount"]);

        return context.sync().then(function () {
          var values = range.values;
          var promises = [];
          var hasText = false;

          for (var r = 0; r < values.length; r++) {
            var rowPromises = [];
            for (var c = 0; c < values[r].length; c++) {
              var text = values[r][c] ? values[r][c].toString() : "";
              if (text.trim() !== "") {
                hasText = true;
                rowPromises.push(translateText(text, srcLang, tgtLang));
              } else {
                rowPromises.push(Promise.resolve(""));
              }
            }
            promises.push(Promise.all(rowPromises));
          }

          if (!hasText) {
            showStatus("Pilih sel yang berisi teks terlebih dahulu!", "warning");
            btn.disabled = false;
            btnText.innerText = "Terjemahkan Sel Terpilih";
            return;
          }

          showStatus("Proses menerjemahkan teks...", "info");

          return Promise.all(promises).then(function (translatedValues) {
            var targetRange;

            if (position === "replace") {
              targetRange = range;
            } else if (position === "right") {
              targetRange = range.getOffsetRange(0, range.columnCount);
            } else if (position === "below") {
              targetRange = range.getOffsetRange(range.rowCount, 0);
            }

            targetRange.values = translatedValues;
            return context.sync().then(function () {
              showStatus("Berhasil menerjemahkan sel!", "success");
            });
          });
        });
      }).catch(function (error) {
        console.error(error);
        showStatus("Gagal: " + (error.message || "Terjadi kesalahan pada Excel API."), "error");
      }).then(function () {
        btn.disabled = false;
        btnText.innerText = "Terjemahkan Sel Terpilih";
      });
    }

    // Engine Penerjemah dengan Backup API (Fallback)
    function translateText(text, from, to) {
      var src = from === "auto" ? "" : from;
      var langPair = (src || "autodetect") + "|" + to;

      // API Utama: MyMemory
      var url1 = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=" + encodeURIComponent(langPair);

      return fetch(url1)
        .then(function (res) { return res.json(); })
        .then(function (json) {
          if (json.responseData && json.responseData.translatedText) {
            return json.responseData.translatedText;
          }
          throw new Error("API 1 Fail");
        })
        .catch(function () {
          // API Cadangan: Google Translate GTX Endpoint
          var sl = src || "auto";
          var url2 = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" + sl + "&tl=" + to + "&dt=t&q=" + encodeURIComponent(text);

          return fetch(url2)
            .then(function (res) { return res.json(); })
            .then(function (json) {
              if (json && json[0]) {
                var result = "";
                for (var i = 0; i < json[0].length; i++) {
                  if (json[0][i][0]) result += json[0][i][0];
                }
                return result;
              }
              return "[Gagal]";
            })
            .catch(function () {
              return "[Gagal Menerjemahkan]";
            });
        });
    }

    // Helper Tampilan Status Box
    function showStatus(
