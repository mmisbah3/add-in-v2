<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Translator</title>
  <!-- Office JS -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 min-h-screen flex flex-col justify-between">

  <div class="space-y-4">
    <!-- Header -->
    <div class="border-b pb-2">
      <h1 class="text-lg font-bold text-emerald-700 flex items-center gap-2">
        🌐 Excel Translator
      </h1>
      <p class="text-xs text-gray-500">Terjemahkan teks sel langsung di lembar kerja Excel.</p>
    </div>

    <!-- Pilihan Bahasa -->
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Bahasa Asal (Sebelum)</label>
        <select id="sourceLang" class="w-full text-xs p-2 border rounded bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          <option value="auto" selected>Auto Detect (Otomatis)</option>
          <option value="en">English (Inggris)</option>
          <option value="id">Indonesian (Indonesia)</option>
          <option value="ja">Japanese (Jepang)</option>
          <option value="zh">Chinese (Mandarin)</option>
          <option value="ko">Korean (Korea)</option>
          <option value="es">Spanish (Spanyol)</option>
          <option value="fr">French (Prancis)</option>
          <option value="de">German (Jerman)</option>
          <option value="ar">Arabic (Arab)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Bahasa Tujuan (Sesudah)</label>
        <select id="targetLang" class="w-full text-xs p-2 border rounded bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          <option value="id" selected>Indonesian (Indonesia)</option>
          <option value="en">English (Inggris)</option>
          <option value="ja">Japanese (Jepang)</option>
          <option value="zh">Chinese (Mandarin)</option>
          <option value="ko">Korean (Korea)</option>
          <option value="es">Spanish (Spanyol)</option>
          <option value="fr">French (Prancis)</option>
          <option value="de">German (Jerman)</option>
          <option value="ar">Arabic (Arab)</option>
        </select>
      </div>
    </div>

    <!-- Pilihan Lokasi Hasil -->
    <div class="space-y-1">
      <label class="block text-xs font-semibold text-gray-600 mb-1">Posisi Hasil Terjemahan</label>
      <div class="space-y-1 bg-white p-2 border rounded">
        <label class="flex items-center text-xs gap-2 cursor-pointer">
          <input type="radio" name="position" value="right" checked class="text-emerald-600 focus:ring-emerald-500">
          <span>Di Samping (Kolom Sebelah)</span>
        </label>
        <label class="flex items-center text-xs gap-2 cursor-pointer">
          <input type="radio" name="position" value="below" class="text-emerald-600 focus:ring-emerald-500">
          <span>Di Bawah (Baris Sebelah)</span>
        </label>
        <label class="flex items-center text-xs gap-2 cursor-pointer">
          <input type="radio" name="position" value="replace" class="text-emerald-600 focus:ring-emerald-500">
          <span>Timpa Sel Asli (Overwrite)</span>
        </label>
      </div>
    </div>

    <!-- Tombol Eksekusi -->
    <button id="btnTranslate" onclick="handleTranslate()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold py-2 px-4 rounded text-xs transition duration-150 shadow flex justify-center items-center gap-2">
      <span>Terjemahkan Sel Terpilih</span>
    </button>

    <!-- Status Output -->
    <div id="status" class="hidden text-xs p-2.5 rounded border"></div>
  </div>

  <div class="text-[10px] text-gray-400 text-center mt-4">
    Excel Web Translator Add-in v1.1
  </div>

  <script>
    Office.onReady((info) => {
      if (info.host === Office.HostType.Excel) {
        showStatus("Add-in siap digunakan.", "info");
      }
    });

    // Fungsi Utama Terjemahkan
    async function handleTranslate() {
      const btn = document.getElementById("btnTranslate");
      const srcLang = document.getElementById("sourceLang").value;
      const tgtLang = document.getElementById("targetLang").value;
      const position = document.querySelector('input[name="position"]:checked').value;

      btn.disabled = true;
      btn.innerText = "Menerjemahkan...";
      showStatus("Membaca sel yang dipilih...", "info");

      try {
        await Excel.run(async (context) => {
          const range = context.workbook.getSelectedRange();
          range.load(["values", "address", "rowCount", "columnCount"]);
          await context.sync();

          const values = range.values;
          let hasContent = false;

          // Evaluasi apakah ada teks
          for (let r = 0; r < values.length; r++) {
            for (let c = 0; c < values[r].length; c++) {
              if (values[r][c] && values[r][c].toString().trim() !== "") {
                hasContent = true;
                break;
              }
            }
          }

          if (!hasContent) {
            showStatus("Pilih sel yang berisi teks terlebih dahulu!", "warning");
            return;
          }

          // Proses penerjemahan per sel
          const translatedValues = [];
          for (let r = 0; r < values.length; r++) {
            const rowArr = [];
            for (let c = 0; c < values[r].length; c++) {
              const text = values[r][c] ? values[r][c].toString() : "";
              if (text.trim() === "") {
                rowArr.push("");
              } else {
                const translated = await translateText(text, srcLang, tgtLang);
                rowArr.push(translated);
              }
            }
            translatedValues.push(rowArr);
          }

          // Menentukan Target Range penulisan
          let targetRange;
          if (position === "replace") {
            targetRange = range;
          } else if (position === "right") {
            targetRange = range.getOffsetRange(0, range.columnCount);
          } else if (position === "below") {
            targetRange = range.getOffsetRange(range.rowCount, 0);
          }

          targetRange.values = translatedValues;
          await context.sync();

          showStatus("Berhasil menerjemahkan " + (values.length * values[0].length) + " sel!", "success");
        });
      } catch (error) {
        console.error(error);
        showStatus("Gagal: " + (error.message || "Terjadi kesalahan pada Excel API."), "error");
      } finally {
        btn.disabled = false;
        btn.innerText = "Terjemahkan Sel Terpilih";
      }
    }

    // Fungsi Penerjemah Multi-API (Fallback System)
    async function translateText(text, from, to) {
      const src = from === "auto" ? "" : from;

      // Primary API: MyMemory API
      try {
        const langPair = (src || "autodetect") + "|" + to;
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}`);
        if (res.ok) {
          const json = await res.json();
          if (json.responseData && json.responseData.translatedText) {
            return json.responseData.translatedText;
          }
        }
      } catch (e) {
        console.warn("MyMemory API failed, trying secondary...", e);
      }

      // Secondary API: Google Translate Free Endpoint
      try {
        const sl = src || "auto";
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`);
        if (res.ok) {
          const json = await res.json();
          if (json && json[0]) {
            return json[0].map(item => item[0]).join("");
          }
        }
      } catch (e) {
        console.warn("Google API failed, trying tertiary...", e);
      }

      return "[Gagal Menerjemahkan]";
    }

    // Helper Tampilan Status
    function showStatus(msg, type) {
      const el = document.getElementById("status");
      el.classList.remove("hidden", "bg-blue-50", "text-blue-700", "border-blue-200", "bg-red-50", "text-red-700", "border-red-200", "bg-amber-50", "text-amber-700", "border-amber-200", "bg-emerald-50", "text-emerald-700", "border-emerald-200");
      
      if (type === "error") {
        el.classList.add("bg-red-50", "text-red-700", "border-red-200");
      } else if (type === "warning") {
        el.classList.add("bg-amber-50", "text-amber-700", "border-amber-200");
      } else if (type === "success") {
        el.classList.add("bg-emerald-50", "text-emerald-700", "border-emerald-200");
      } else {
        el.classList.add("bg-blue-50", "text-blue-700", "border-blue-200");
      }
      
      el.innerText = msg;
    }
  </script>
</body>
</html>
