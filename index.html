<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Excel Translator 2016</title>
  
  <!-- Office JS -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  
  <style>
    body { font-family: Segoe UI, Tahoma, sans-serif; padding: 10px; background: #f9fafb; font-size: 11px; color: #333; margin: 0; }
    .title { font-size: 14px; font-weight: bold; color: #047857; margin-bottom: 2px; }
    .desc { color: #6b7280; margin-bottom: 10px; font-size: 10px; }
    label { font-weight: bold; display: block; margin-top: 8px; margin-bottom: 2px; color: #374151; }
    select, input[type="text"] { width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 3px; box-sizing: border-box; }
    .box { background: #fff; padding: 6px; border: 1px solid #ccc; border-radius: 3px; margin-top: 4px; }
    .radio-item { display: block; margin-bottom: 4px; cursor: pointer; }
    .btn { width: 100%; background: #059669; color: #fff; padding: 8px; border: none; border-radius: 3px; font-weight: bold; margin-top: 10px; cursor: pointer; }
    .btn:disabled { background: #9ca3af; }
    .status { margin-top: 8px; padding: 6px; border-radius: 3px; display: none; word-wrap: break-word; font-size: 10px; }
    .status-info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .status-success { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .status-error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  </style>
</head>
<body>

  <div class="title">🌐 Excel Translator</div>
  <div class="desc">Excel 2016 Compatible</div>

  <label>Bahasa Asal</label>
  <select id="srcLang">
    <option value="auto">Auto Detect</option>
    <option value="en">English</option>
    <option value="id">Indonesian</option>
    <option value="ja">Japanese</option>
    <option value="zh-CN">Chinese</option>
    <option value="ko">Korean</option>
  </select>

  <label>Bahasa Tujuan</label>
  <select id="tgtLang">
    <option value="id" selected>Indonesian</option>
    <option value="en">English</option>
    <option value="ja">Japanese</option>
    <option value="zh-CN">Chinese</option>
    <option value="ko">Korean</option>
  </select>

  <label>Posisi Hasil</label>
  <div class="box">
    <label class="radio-item"><input type="radio" name="pos" value="right" checked> Di Samping (Kolom Sebelah)</label>
    <label class="radio-item"><input type="radio" name="pos" value="below"> Di Bawah (Baris Sebelah)</label>
    <label class="radio-item"><input type="radio" name="pos" value="replace"> Timpa Sel Asli</label>
  </div>

  <button id="btnTrans" class="btn" onclick="startTranslate()">Terjemahkan Sel Terpilih</button>

  <div id="status" class="status"></div>

  <script>
    Office.onReady(function (info) {
      if (info.host === Office.HostType.Excel) {
        showStatus("Ready.", "info");
      }
    });

    function startTranslate() {
      var btn = document.getElementById("btnTrans");
      var src = document.getElementById("srcLang").value;
      var tgt = document.getElementById("tgtLang").value;
      var radios = document.getElementsByName("pos");
      var pos = "right";

      for (var i = 0; i < radios.length; i++) {
        if (radios[i].checked) { pos = radios[i].value; break; }
      }

      btn.disabled = true;
      btn.innerHTML = "Memproses...";
      showStatus("Membaca sel Excel...", "info");

      Excel.run(function (ctx) {
        var range = ctx.workbook.getSelectedRange();
        range.load(["values", "rowCount", "columnCount"]);

        return ctx.sync().then(function () {
          var vals = range.values;
          var rCount = vals.length;
          var cCount = vals[0].length;
          var total = rCount * cCount;
          var translated = [];
          var pending = 0;

          for (var r = 0; r < rCount; r++) {
            var row = [];
            for (var c = 0; c < cCount; c++) row.push("");
            translated.push(row);
          }

          for (var r = 0; r < rCount; r++) {
            for (var c = 0; c < cCount; c++) {
              var txt = vals[r][c] ? String(vals[r][c]).replace(/^\s+|\s+$/g, '') : "";
              if (txt !== "") pending++;
            }
          }

          if (pending === 0) {
            showStatus("Pilih sel yang berisi teks!", "error");
            btn.disabled = false;
            btn.innerHTML = "Terjemahkan Sel Terpilih";
            return;
          }

          showStatus("Menerjemahkan " + pending + " sel...", "info");

          for (var r = 0; r < rCount; r++) {
            for (var c = 0; c < cCount; c++) {
              var text = vals[r][c] ? String(vals[r][c]).replace(/^\s+|\s+$/g, '') : "";
              if (text !== "") {
                (function (row, col, str) {
                  googleTranslate(str, src, tgt, function (res) {
                    translated[row][col] = res;
                    pending--;

                    if (pending <= 0) {
                      var targetRange;
                      if (pos === "replace") targetRange = range;
                      else if (pos === "right") targetRange = range.getOffsetRange(0, cCount);
                      else if (pos === "below") targetRange = range.getOffsetRange(rCount, 0);

                      targetRange.values = translated;
                      ctx.sync().then(function () {
                        showStatus("Selesai menerjemahkan " + total + " sel!", "success");
                        btn.disabled = false;
                        btn.innerHTML = "Terjemahkan Sel Terpilih";
                      });
                    }
                  });
                })(r, c, text);
              }
            }
          }
        });
      }).catch(function (err) {
        showStatus("Gagal: " + err.message, "error");
        btn.disabled = false;
        btn.innerHTML = "Terjemahkan Sel Terpilih";
      });
    }

    // Engine Google Translate GTX (JSONP)
    function googleTranslate(text, sl, tl, cb) {
      var cbName = "cb_" + Math.floor(Math.random() * 1000000);
      var done = false;

      window[cbName] = function (data) {
        if (done) return;
        done = true;
        clean();
        if (data && data[0]) {
          var out = "";
          for (var i = 0; i < data[0].length; i++) {
            if (data[0][i][0]) out += data[0][i][0];
          }
          cb(out);
        } else {
          cb("[Gagal]");
        }
      };

      function clean() {
        delete window[cbName];
        var s = document.getElementById(cbName);
        if (s && s.parentNode) s.parentNode.removeChild(s);
      }

      var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" + sl + "&tl=" + tl + "&dt=t&q=" + encodeURIComponent(text) + "&callback=" + cbName;
      var script = document.createElement("script");
      script.id = cbName;
      script.src = url;

      setTimeout(function () {
        if (!done) {
          done = true;
          clean();
          cb("[Timeout]");
        }
      }, 6000);

      document.body.appendChild(script);
    }

    function showStatus(msg, type) {
      var el = document.getElementById("status");
      el.style.display = "block";
      el.className = "status status-" + type;
      el.innerText = msg;
    }
  </script>
</body>
</html>
