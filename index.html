<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Translator 2016</title>
  
  <!-- Office JS -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  
  <!-- CSS Sederhana (Kompatibel IE11) -->
  <style>
    body { font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif; padding: 12px; background-color: #f9fafb; color: #333; margin: 0; }
    .title { font-size: 16px; font-weight: bold; color: #047857; margin-bottom: 4px; }
    .subtitle { font-size: 11px; color: #6b7280; margin-bottom: 15px; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; }
    label { font-size: 12px; font-weight: bold; color: #374151; display: block; margin-bottom: 4px; }
    select, input[type="text"] { width: 100%; padding: 6px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 4px; margin-bottom: 12px; box-sizing: border-box; }
    .radio-group { background: #fff; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; margin-bottom: 15px; }
    .radio-item { font-size: 12px; display: block; margin-bottom: 6px; cursor: pointer; }
    .radio-item input { margin-right: 6px; }
    .btn { width: 100%; background-color: #059669; color: white; padding: 8px; font-weight: bold; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; }
    .btn:disabled { background-color: #9ca3af; cursor: not-allowed; }
    .status { font-size: 11px; padding: 8px; border-radius: 4px; margin-top: 12px; display: none; word-wrap: break-word; }
    .status-info { background-color: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .status-success { background-color: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .status-error { background-color: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .status-warning { background-color: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
  </style>
</head>
<body>

  <div class="title">🌐 Excel Translator</div>
  <div class="subtitle">Penerjemah Sel Khusus Excel 2016 Desktop</div>

  <label for="sourceLang">Bahasa Asal (Sebelum)</label>
  <select id="sourceLang">
    <option value="auto" selected>Auto Detect (Otomatis)</option>
    <option value="en">English (Inggris)</option>
    <option value="id">Indonesian (Indonesia)</option>
    <option value="ja">Japanese (Jepang)</option>
    <option value="zh">Chinese (Mandarin)</option>
    <option value="ko">Korean (Korea)</option>
    <option value="es">Spanish (Spanyol)</option>
    <option value="fr">French (Prancis)</option>
    <option value="de">German (Jerman)</option>
  </select>

  <label for="targetLang">Bahasa Tujuan (Sesudah)</label>
  <select id="targetLang">
    <option value="id" selected>Indonesian (Indonesia)</option>
    <option value="en">English (Inggris)</option>
    <option value="ja">Japanese (Jepang)</option>
    <option value="zh">Chinese (Mandarin)</option>
    <option value="ko">Korean (Korea)</option>
    <option value="es">Spanish (Spanyol)</option>
    <option value="fr">French (Prancis)</option>
    <option value="de">German (Jerman)</option>
  </select>

  <label>Posisi Hasil Terjemahan</label>
  <div class="radio-group">
    <label class="radio-item"><input type="radio" name="position" value="right" checked> Di Samping (Kolom Sebelah)</label>
    <label class="radio-item"><input type="radio" name="position" value="below"> Di Bawah (Baris Sebelah)</label>
    <label class="radio-item"><input type="radio" name="position" value="replace"> Timpa Sel Asli (Overwrite)</label>
  </div>

  <button id="btnTranslate" class="btn" onclick="handleTranslate()">Terjemahkan Sel Terpilih</button>

  <div id="status" class="status"></div>

  <script>
    Office.onReady(function (info) {
      if (info.host === Office.HostType.Excel) {
        showStatus("Add-in siap digunakan.", "info");
      }
    });

    function handleTranslate() {
      var btn = document.getElementById("btnTranslate");
      var srcLang = document.getElementById("sourceLang").value;
      var tgtLang = document.getElementById("targetLang").value;
      var radios = document.getElementsByName("position");
      var position = "right";

      for (var i = 0; i < radios.length; i++) {
        if (radios[i].checked) {
          position = radios[i].value;
          break;
        }
      }

      btn.disabled = true;
      btn.innerText = "Menerjemahkan...";
      showStatus("Membaca sel...", "info");

      Excel.run(function (context) {
        var range = context.workbook.getSelectedRange();
        range.load(["values", "rowCount", "columnCount"]);

        return context.sync().then(function () {
          var values = range.values;
          var totalCells = values.length * values[0].length;
          var processed = 0;
          var translatedValues = [];

          for (var i = 0; i < values.length; i++) {
            translatedValues.push(new Array(values[i].length));
          }

          function processNextCell(r, c) {
            if (r >= values.length) {
              // Selesai menerjemahkan semua sel
              var targetRange;
              if (position === "replace") {
                targetRange = range;
              } else if (position === "right") {
                targetRange = range.getOffsetRange(0, range.columnCount);
              } else if (position === "below") {
                targetRange = range.getOffsetRange(range.rowCount, 0);
              }

              targetRange.values = translatedValues;
              return context.sync().then(function () {
                showStatus("Berhasil menerjemahkan " + totalCells + " sel!", "success");
                btn.disabled = false;
                btn.innerText = "Terjemahkan Sel Terpilih";
              });
            }

            var nextR = c + 1 >= values[r].length ? r + 1 : r;
            var nextC = c + 1 >= values[r].length ? 0 : c + 1;

            var text = values[r][c] ? values[r][c].toString() : "";
            if (text.replace(/^\s+|\s+$/g, '') === "") {
              translatedValues[r][c] = "";
              processNextCell(nextR, nextC);
            } else {
              showStatus("Menerjemahkan sel (" + (r + 1) + "," + (c + 1) + ")...", "info");
              ajaxTranslate(text, srcLang, tgtLang, function (resText) {
                translatedValues[r][c] = resText;
                processNextCell(nextR, nextC);
              });
            }
          }

          processNextCell(0, 0);
        });
      }).catch(function (error) {
        showStatus("Error Excel: " + (error.message || error), "error");
        btn.disabled = false;
        btn.innerText = "Terjemahkan Sel Terpilih";
      });
    }

    // Fungsi AJAX murni untuk IE11
    function ajaxTranslate(text, from, to, callback) {
      var src = from === "auto" ? "" : from;
      var langPair = (src || "autodetect") + "|" + to;
      var url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=" + encodeURIComponent(langPair);

      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var json = JSON.parse(xhr.responseText);
              if (json.responseData && json.responseData.translatedText) {
                callback(json.responseData.translatedText);
                return;
              }
            } catch (e) {}
          }
          // Backup API jika API 1 gagal
          ajaxTranslateBackup(text, src, to, callback);
        }
      };
      xhr.send();
    }

    function ajaxTranslateBackup(text, src, to, callback) {
      var sl = src || "auto";
      var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" + sl + "&tl=" + to + "&dt=t&q=" + encodeURIComponent(text);

      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var json = JSON.parse(xhr.responseText);
              if (json && json[0]) {
                var res = "";
                for (var i = 0; i < json[0].length; i++) {
                  if (json[0][i][0]) res += json[0][i][0];
                }
                callback(res);
                return;
              }
            } catch (e) {}
          }
          callback("[Gagal Menerjemahkan]");
        }
      };
      xhr.send();
    }

    function showStatus(msg, type) {
      var el = document.getElementById("status");
      el.style.display = "block";
      el.className = "status status-" + type;
      el.innerText = msg;
    }
  </script>
</body>
</html>
