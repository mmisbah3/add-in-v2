<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Translator 2016 Multi-Cell</title>
  
  <!-- Office JS -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  
  <style>
    body { font-family: Segoe UI, Tahoma, sans-serif; padding: 12px; background-color: #f9fafb; color: #333; margin: 0; }
    .title { font-size: 15px; font-weight: bold; color: #047857; margin-bottom: 4px; }
    .subtitle { font-size: 11px; color: #6b7280; margin-bottom: 12px; border-bottom: 1px solid #e5e7eb; padding-bottom: 6px; }
    label { font-size: 11px; font-weight: bold; color: #374151; display: block; margin-bottom: 3px; }
    select { width: 100%; padding: 5px; font-size: 11px; border: 1px solid #d1d5db; border-radius: 4px; margin-bottom: 10px; }
    .radio-group { background: #fff; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; margin-bottom: 12px; }
    .radio-item { font-size: 11px; display: block; margin-bottom: 4px; cursor: pointer; }
    .radio-item input { margin-right: 5px; }
    .btn { width: 100%; background-color: #059669; color: white; padding: 8px; font-weight: bold; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; }
    .btn:disabled { background-color: #9ca3af; cursor: not-allowed; }
    .status { font-size: 11px; padding: 8px; border-radius: 4px; margin-top: 10px; display: none; word-wrap: break-word; }
    .status-info { background-color: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .status-success { background-color: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .status-error { background-color: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .status-warning { background-color: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
  </style>
</head>
<body>

  <div class="title">🌐 Excel Translator</div>
  <div class="subtitle">Menerjemahkan Sel/Range Terpilih</div>

  <label for="sourceLang">Bahasa Asal (Sebelum)</label>
  <select id="sourceLang">
    <option value="auto" selected>Auto Detect (Otomatis)</option>
    <option value="en">English (Inggris)</option>
    <option value="id">Indonesian (Indonesia)</option>
    <option value="ja">Japanese (Jepang)</option>
    <option value="zh">Chinese (Mandarin)</option>
    <option value="ko">Korean (Korea)</option>
    <option value="es">Spanish (Spanyol)</option>
    <option value="fr">French (Prancis)</option>
    <option value="de">German (Jerman)</option>
    <option value="ar">Arabic (Arab)</option>
  </select>

  <label for="targetLang">Bahasa Tujuan (Sesudah)</label>
  <select id="targetLang">
    <option value="id" selected>Indonesian (Indonesia)</option>
    <option value="en">English (Inggris)</option>
    <option value="ja">Japanese (Jepang)</option>
    <option value="zh">Chinese (Mandarin)</option>
    <option value="ko">Korean (Korea)</option>
    <option value="es">Spanish (Spanyol)</option>
    <option value="fr">French (Prancis)</option>
    <option value="de">German (Jerman)</option>
    <option value="ar">Arabic (Arab)</option>
  </select>

  <label>Posisi Hasil Terjemahan</label>
  <div class="radio-group">
    <label class="radio-item"><input type="radio" name="position" value="right" checked> Di Samping (Kolom Sebelah)</label>
    <label class="radio-item"><input type="radio" name="position" value="below"> Di Bawah (Baris Sebelah)</label>
    <label class="radio-item"><input type="radio" name="position" value="replace"> Timpa Sel Asli (Overwrite)</label>
  </div>

  <button id="btnTranslate" class="btn" onclick="handleTranslate()">Terjemahkan Sel Terpilih</button>

  <div id="status" class="status"></div>

  <script>
    Office.onReady(function (info) {
      if (info.host === Office.HostType.Excel) {
        showStatus("Add-in siap digunakan.", "info");
      }
    });

    function handleTranslate() {
      var btn = document.getElementById("btnTranslate");
      var srcLang = document.getElementById("sourceLang").value;
      var tgtLang = document.getElementById("targetLang").value;
      var radios = document.getElementsByName("position");
      var position = "right";

      for (var i = 0; i < radios.length; i++) {
        if (radios[i].checked) { position = radios[i].value; break; }
      }

      btn.disabled = true;
      btn.innerText = "Memproses Terjemahan...";
      showStatus("Membaca sel terpilih...", "info");

      Excel.run(function (context) {
        var range = context.workbook.getSelectedRange();
        range.load(["values", "rowCount", "columnCount"]);

        return context.sync().then(function () {
          var values = range.values;
          var rowCount = values.length;
          var colCount = values[0].length;
          var totalCells = rowCount * colCount;

          var translatedMatrix = [];
          var pendingCount = 0;
          var hasText = false;

          // Inisialisasi matriks hasil
          for (var r = 0; r < rowCount; r++) {
            var rowArray = [];
            for (var c = 0; c < colCount; c++) {
              rowArray.push("");
            }
            translatedMatrix.push(rowArray);
          }

          // Hitung sel yang berisi teks
          for (var r = 0; r < rowCount; r++) {
            for (var c = 0; c < colCount; c++) {
              var str = values[r][c] ? values[r][c].toString().replace(/^\s+|\s+$/g, '') : "";
              if (str !== "") {
                hasText = true;
                pendingCount++;
              }
            }
          }

          if (!hasText) {
            showStatus("Tidak ada teks pada sel yang Anda pilih!", "warning");
            btn.disabled = false;
            btn.innerText = "Terjemahkan Sel Terpilih";
            return;
          }

          showStatus("Menerjemahkan " + pendingCount + " sel...", "info");

          // Eksekusi terjemahan paralel per sel
          for (var r = 0; r < rowCount; r++) {
            for (var c = 0; c < colCount; c++) {
              var text = values[r][c] ? values[r][c].toString().replace(/^\s+|\s+$/g, '') : "";
              if (text !== "") {
                (function(row, col, txt) {
                  jsonpTranslate(txt, srcLang, tgtLang, function(res) {
                    translatedMatrix[row][col] = res;
                    pendingCount--;

                    if (pendingCount <= 0) {
                      // Semua sel selesai diproses, tulis hasil ke Excel
                      var targetRange;
                      if (position === "replace") targetRange = range;
                      else if (position === "right") targetRange = range.getOffsetRange(0, colCount);
                      else if (position === "below") targetRange = range.getOffsetRange(rowCount, 0);

                      targetRange.values = translatedMatrix;
                      context.sync().then(function() {
                        showStatus("Selesai menerjemahkan " + totalCells + " sel!", "success");
                        btn.disabled = false;
                        btn.innerText = "Terjemahkan Sel Terpilih";
                      }).catch(function(err) {
                        showStatus("Gagal menulis ke sel: " + (err.message || err), "error");
                        btn.disabled = false;
                        btn.innerText = "Terjemahkan Sel Terpilih";
                      });
                    }
                  });
                })(r, c, text);
              }
            }
          }
        });
      }).catch(function (error) {
        showStatus("Gagal membaca sel: " + (error.message || error), "error");
        btn.disabled = false;
        btn.innerText = "Terjemahkan Sel Terpilih";
      });
    }

    // Engine JSONP untuk IE11 / Excel 2016
    function jsonpTranslate(text, from, to, callback) {
      var src = (from === "auto") ? "" : from;
      var pair = (src || "autodetect") + "|" + to;
      var cbName = "cb_" + Math.floor(Math.random() * 10000000);

      var isResponded = false;

      window[cbName] = function (data) {
        if (isResponded) return;
        isResponded = true;

        delete window[cbName];
        var script = document.getElementById(cbName);
        if (script && script.parentNode) script.parentNode.removeChild(script);

        if (data && data.responseData && data.responseData.translatedText) {
          callback(data.responseData.translatedText);
        } else {
          callback("[Gagal]");
        }
      };

      var url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=" + encodeURIComponent(pair) + "&callback=" + cbName;
      var scriptElem = document.createElement("script");
      scriptElem.id = cbName;
      scriptElem.src = url;

      // Handling timeout jika koneksi internet lambat
      setTimeout(function() {
        if (!isResponded) {
          isResponded = true;
          delete window[cbName];
          if (scriptElem && scriptElem.parentNode) scriptElem.parentNode.removeChild(scriptElem);
          callback("[Timeout]");
        }
      }, 8000);

      document.body.appendChild(scriptElem);
    }

    function showStatus(msg, type) {
      var el = document.getElementById("status
