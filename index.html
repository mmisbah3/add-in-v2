<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Translator Add-in</title>
    <!-- Office JS SDK -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
        }
        .custom-ring:focus {
            outline: none;
            box-shadow: 0 0 0 2px #10b981;
        }
    </style>
</head>
<body class="p-4 text-slate-800 flex flex-col h-screen">

    <!-- Header -->
    <div class="flex items-center gap-2 mb-4 pb-2 border-b border-slate-200">
        <div class="bg-emerald-600 text-white p-2 rounded-lg">
            <i class="fa-solid font-bold fa-language text-xl"></i>
        </div>
        <div>
            <h1 class="font-bold text-slate-800 text-base leading-tight">Excel Translator</h1>
            <p class="text-xs text-slate-500">Terjemahkan sel dengan cepat</p>
        </div>
    </div>

    <!-- Main Form -->
    <div class="flex-1 space-y-4 text-sm overflow-y-auto pr-1">

        <!-- Source Language -->
        <div>
            <label class="block font-medium text-slate-700 mb-1" for="sourceLang">
                <i class="fa-solid fa-arrow-right-to-bracket text-emerald-600 mr-1"></i> Bahasa Asal
            </label>
            <select id="sourceLang" class="w-full bg-white border border-slate-300 rounded-lg p-2.5 custom-ring text-slate-700 text-sm">
                <option value="auto" selected>Otomatis Deteksi (Auto-Detect)</option>
                <option value="id">Bahasa Indonesia</option>
                <option value="en">English (Inggris)</option>
                <option value="es">Español (Spanyol)</option>
                <option value="zh">Mandarin (China)</option>
                <option value="ja">Japanese (Jepang)</option>
                <option value="ko">Korean (Korea)</option>
                <option value="ar">Arabic (Arab)</option>
                <option value="de">Deutsch (Jerman)</option>
                <option value="fr">Français (Prancis)</option>
                <option value="ru">Russian (Rusia)</option>
                <option value="pt">Português (Portugis)</option>
            </select>
        </div>

        <!-- Target Language -->
        <div>
            <label class="block font-medium text-slate-700 mb-1" for="targetLang">
                <i class="fa-solid fa-language text-emerald-600 mr-1"></i> Bahasa Tujuan
            </label>
            <select id="targetLang" class="w-full bg-white border border-slate-300 rounded-lg p-2.5 custom-ring text-slate-700 text-sm">
                <option value="en" selected>English (Inggris)</option>
                <option value="id">Bahasa Indonesia</option>
                <option value="es">Español (Spanyol)</option>
                <option value="zh">Mandarin (China)</option>
                <option value="ja">Japanese (Jepang)</option>
                <option value="ko">Korean (Korea)</option>
                <option value="ar">Arabic (Arab)</option>
                <option value="de">Deutsch (Jerman)</option>
                <option value="fr">Français (Prancis)</option>
                <option value="ru">Russian (Rusia)</option>
                <option value="pt">Português (Portugis)</option>
            </select>
        </div>

        <!-- Position Option -->
        <div>
            <label class="block font-medium text-slate-700 mb-2">
                <i class="fa-solid fa-arrows-split-up-and-left text-emerald-600 mr-1"></i> Lokasi Hasil Terjemahan
            </label>
            <div class="space-y-2 bg-white p-3 border border-slate-200 rounded-lg">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="placement" value="right" checked class="text-emerald-600 focus:ring-emerald-500">
                    <span class="text-slate-700">Di Samping (Kolom Sebelah Kanan)</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="placement" value="below" class="text-emerald-600 focus:ring-emerald-500">
                    <span class="text-slate-700">Di Bawah (Baris Sebelah Bawah)</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="placement" value="replace" class="text-emerald-600 focus:ring-emerald-500">
                    <span class="text-slate-700">Timpa Teks Asli (Overwrite)</span>
                </label>
            </div>
        </div>

        <!-- Action Button -->
        <button id="translateBtn" onclick="processTranslation()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-lg shadow-sm transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>Terjemahkan Sel Terpilih</span>
        </button>

        <!-- Status Message -->
        <div id="statusMessage" class="hidden p-3 rounded-lg text-xs font-medium"></div>

    </div>

    <!-- Footer Info -->
    <div class="pt-2 text-center text-xs text-slate-400 border-t border-slate-200 mt-auto">
        Pilih sel di Excel, lalu klik tombol terjemahkan.
    </div>

    <script>
        Office.onReady((info) => {
            if (info.host === Office.HostType.Excel) {
                console.log("Office JS Ready in Excel");
            }
        });

        async function processTranslation() {
            const btn = document.getElementById("translateBtn");
            const status = document.getElementById("statusMessage");
            const sourceLang = document.getElementById("sourceLang").value;
            const targetLang = document.getElementById("targetLang").value;
            const placement = document.querySelector('input[name="placement"]:checked').value;

            // Update UI to loading state
            btn.disabled = true;
            btn.classList.add("opacity-60", "cursor-not-allowed");
            showStatus("Membaca sel dan menerjemahkan...", "info");

            try {
                await Excel.run(async (context) => {
                    const range = context.workbook.getSelectedRange();
                    range.load(["values", "rowCount", "columnCount", "rowIndex", "columnIndex"]);
                    await context.sync();

                    const values = range.values;
                    const rowCount = range.rowCount;
                    const colCount = range.columnCount;

                    // Collect all texts to translate
                    const translatedValues = [];

                    for (let r = 0; r < rowCount; r++) {
                        const rowTrans = [];
                        for (let c = 0; c < colCount; c++) {
                            const originalText = values[r][c];
                            if (originalText && String(originalText).trim() !== "") {
                                const translatedText = await translateText(String(originalText), sourceLang, targetLang);
                                rowTrans.push(translatedText);
                            } else {
                                rowTrans.push("");
                            }
                        }
                        translatedValues.push(rowTrans);
                    }

                    // Determine target range based on placement selection
                    const sheet = context.workbook.worksheets.getActiveWorksheet();
                    let targetRange;

                    if (placement === "right") {
                        targetRange = sheet.getRangeByIndexes(
                            range.rowIndex,
                            range.columnIndex + colCount,
                            rowCount,
                            colCount
                        );
                    } else if (placement === "below") {
                        targetRange = sheet.getRangeByIndexes(
                            range.rowIndex + rowCount,
                            range.columnIndex,
                            rowCount,
                            colCount
                        );
                    } else { // replace
                        targetRange = range;
                    }

                    targetRange.values = translatedValues;
                    await context.sync();

                    showStatus("Berhasil menerjemahkan " + (rowCount * colCount) + " sel!", "success");
                });
            } catch (error) {
                console.error(error);
                showStatus("Gagal menerjemahkan: " + error.message, "error");
            } finally {
                btn.disabled = false;
                btn.classList.remove("opacity-60", "cursor-not-allowed");
            }
        }

        // Free Translation API Call (Using MyMemory API for client-side execution)
        async function translateText(text, source, target) {
            try {
                const langPair = source === "auto" ? `autodetect|${target}` : `${source}|${target}`;
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}`;
                
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.responseData && data.responseData.translatedText) {
                    return data.responseData.translatedText;
                }
                return text;
            } catch (e) {
                console.error("API Error:", e);
                return text;
            }
        }

        function showStatus(msg, type) {
            const status = document.getElementById("statusMessage");
            status.classList.remove("hidden", "bg-emerald-100", "text-emerald-800", "bg-red-100", "text-red-800", "bg-blue-100", "text-blue-800");
            
            if (type === "success") {
                status.classList.add("bg-emerald-100", "text-emerald-800");
            } else if (type === "error") {
                status.classList.add("bg-red-100", "text-red-800");
            } else {
                status.classList.add("bg-blue-100", "text-blue-800");
            }
            status.innerText = msg;
        }
    </script>
</body>
</html>
